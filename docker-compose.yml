services:
  postgres:
    image: postgres:15-alpine
    container_name: outbox-postgres
    environment:
      POSTGRES_DB: outbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "hot_standby=on"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  postgres-replica:
    image: postgres:15-alpine
    container_name: outbox-postgres-replica
    user: "0"
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    entrypoint: ["sh", "/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    container_name: outbox-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: outbox-kafka-ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  order-api:
    build:
      context: .
      dockerfile: order-api/Dockerfile
    container_name: outbox-order-api
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/outbox
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  outbox-job:
    build:
      context: .
      dockerfile: outbox-job/Dockerfile
    container_name: outbox-job
    environment:
      # Primary Postgres - used for WRITES (marking outbox records PUBLISHED)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/outbox
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Replica Postgres - used for READS (polling pending outbox records)
      REPLICA_DATASOURCE_URL: jdbc:postgresql://postgres-replica:5432/outbox
      REPLICA_DATASOURCE_USERNAME: postgres
      REPLICA_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_started
      kafka:
        condition: service_started

  order-consumer:
    build:
      context: .
      dockerfile: order-consumer/Dockerfile
    container_name: outbox-order-consumer
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/outbox
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  order-ui:
    build:
      context: ./order-ui
      dockerfile: Dockerfile
    container_name: outbox-order-ui
    ports:
      - "5173:80"
    depends_on:
      - order-api

volumes:
  postgres-data:
  postgres-replica-data:
  kafka-data:
